<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="x1-logo-title x1-logo-desc">
  <title id="x1-logo-title">X1 六边形触觉脉冲 logo</title>
  <desc id="x1-logo-desc">一个由金属电路线构成的六边形蜂巢，内部有脉冲光点流动，象征柔性触觉网络。</desc>
  <defs>
    <linearGradient id="hex-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8e8f5"/>
      <stop offset="0.12" stop-color="#5bb5d8"/>
      <stop offset="0.32" stop-color="#0e5a7a"/>
      <stop offset="0.48" stop-color="#1a8fc4"/>
      <stop offset="0.68" stop-color="#082f44"/>
      <stop offset="0.88" stop-color="#8cc8db"/>
      <stop offset="1" stop-color="#d0ecf7"/>
    </linearGradient>
    <!-- 金属银白脉冲（中心核心，高光最亮） -->
    <radialGradient id="pulse-silver" cx="30%" cy="20%" r="80%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.12" stop-color="#d0ecf7"/>
      <stop offset="0.3" stop-color="#5bb5d8"/>
      <stop offset="0.55" stop-color="#0e5a7a"/>
      <stop offset="1" stop-color="#041820" stop-opacity=".85"/>
    </radialGradient>
    <!-- 金属蓝脉冲（顶点节点） -->
    <radialGradient id="pulse-metal-blue" cx="30%" cy="20%" r="80%">
      <stop offset="0" stop-color="#d0ecf7"/>
      <stop offset="0.18" stop-color="#5bb5d8"/>
      <stop offset="0.4" stop-color="#1a8fc4"/>
      <stop offset="0.65" stop-color="#0e5a7a"/>
      <stop offset="1" stop-color="#051520" stop-opacity=".9"/>
    </radialGradient>
    <!-- 金属铜脉冲（交替节点，暗红铜质感） -->
    <radialGradient id="pulse-copper" cx="30%" cy="20%" r="80%">
      <stop offset="0" stop-color="#fff0d0"/>
      <stop offset="0.15" stop-color="#f5c788"/>
      <stop offset="0.35" stop-color="#b37b31"/>
      <stop offset="0.6" stop-color="#6b3a18"/>
      <stop offset="1" stop-color="#2a1208" stop-opacity=".9"/>
    </radialGradient>
    <!-- 强辉光滤镜 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 金属投影 -->
    <filter id="metal-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#020508" flood-opacity=".65"/>
    </filter>
  </defs>

  <!-- 六边形蜂巢 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#metal-shadow)">
    <polygon points="60,34 82,48 82,72 60,86 38,72 38,48"
             stroke="url(#hex-stroke)" stroke-width="3.2" opacity=".85" filter="url(#glow)"/>
  </g>

  <!-- 蜂巢内部电路连接线 -->
  <g fill="none" stroke-linecap="round" stroke-width="1.4" opacity=".45">
    <line x1="60" y1="60" x2="60" y2="34" stroke="#5bb5d8"/>
    <line x1="60" y1="60" x2="82" y2="48" stroke="#0e5a7a"/>
    <line x1="60" y1="60" x2="82" y2="72" stroke="#5bb5d8"/>
    <line x1="60" y1="60" x2="60" y2="86" stroke="#0e5a7a"/>
    <line x1="60" y1="60" x2="38" y2="72" stroke="#5bb5d8"/>
    <line x1="60" y1="60" x2="38" y2="48" stroke="#0e5a7a"/>
    <line x1="60" y1="34" x2="72" y2="28" stroke="#5bb5d8" opacity=".3"/>
    <line x1="82" y1="48" x2="90" y2="44" stroke="#0e5a7a" opacity=".3"/>
    <line x1="82" y1="72" x2="90" y2="76" stroke="#5bb5d8" opacity=".3"/>
    <line x1="60" y1="86" x2="48" y2="92" stroke="#0e5a7a" opacity=".3"/>
    <line x1="38" y1="72" x2="30" y2="76" stroke="#5bb5d8" opacity=".3"/>
    <line x1="38" y1="48" x2="30" y2="44" stroke="#0e5a7a" opacity=".3"/>
  </g>

  <!-- 触觉脉冲光点（6个节点） -->
  <g filter="url(#glow-strong)">
    <circle cx="60" cy="34" r="4" fill="url(#pulse-metal-blue)" class="pulse-node">
      <animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;1;.7" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="82" cy="48" r="4" fill="url(#pulse-silver)" class="pulse-node">
      <animate attributeName="r" values="3;5;3" dur="2.8s" begin=".7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;1;.7" dur="2.8s" begin=".7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="82" cy="72" r="4" fill="url(#pulse-copper)" class="pulse-node">
      <animate attributeName="r" values="3;5;3" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;1;.7" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="86" r="4" fill="url(#pulse-metal-blue)" class="pulse-node">
      <animate attributeName="r" values="3;5;3" dur="2.8s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;1;.7" dur="2.8s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="38" cy="72" r="4" fill="url(#pulse-silver)" class="pulse-node">
      <animate attributeName="r" values="3;5;3" dur="2.8s" begin=".35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;1;.7" dur="2.8s" begin=".35s" repeatCount="indefinite"/>
    </circle>
    <circle cx="38" cy="48" r="4" fill="url(#pulse-copper)" class="pulse-node">
      <animate attributeName="r" values="3;5;3" dur="2.8s" begin="1.05s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;1;.7" dur="2.8s" begin="1.05s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 中心核心光点（金属银白，最高亮度） -->
  <circle cx="60" cy="60" r="6" fill="url(#pulse-silver)" filter="url(#glow-strong)">
    <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".6;1;.6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- 脉冲波纹扩散 -->
  <circle cx="60" cy="60" r="8" fill="none" stroke="#5bb5d8" stroke-width=".8" opacity="0">
    <animate attributeName="r" values="8;22" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".5;0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="60" r="8" fill="none" stroke="#0e5a7a" stroke-width=".8" opacity="0">
    <animate attributeName="r" values="8;22" dur="2.5s" begin="1.25s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".5;0" dur="2.5s" begin="1.25s" repeatCount="indefinite"/>
  </circle>

</svg>
