<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="x1-logo-title x1-logo-desc">
  <title id="x1-logo-title">X1 六边形触觉脉冲 logo</title>
  <desc id="x1-logo-desc">一个由电路线构成的六边形蜂巢，内部有脉冲光点流动，象征柔性触觉网络。</desc>
  <defs>
    <linearGradient id="hex-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20c7c2"/>
      <stop offset="0.5" stop-color="#176fdf"/>
      <stop offset="1" stop-color="#20c7c2"/>
    </linearGradient>
    <linearGradient id="hex-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20c7c2" stop-opacity=".7"/>
      <stop offset="1" stop-color="#176fdf" stop-opacity=".3"/>
    </linearGradient>
    <radialGradient id="pulse-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#20c7c2" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#20c7c2" stop-opacity=".5"/>
      <stop offset="1" stop-color="#20c7c2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pulse-orange" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff775c" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#ff775c" stop-opacity=".4"/>
      <stop offset="1" stop-color="#ff775c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pulse-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#176fdf" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#176fdf" stop-opacity=".5"/>
      <stop offset="1" stop-color="#176fdf" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 外层六边形蜂巢（3个六边形嵌套，象征柔性贴合层叠） -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 最外层六边形 -->
    <polygon points="60,8 104,34 104,86 60,112 16,86 16,34"
             stroke="url(#hex-stroke)" stroke-width="2.2" opacity=".35"/>
    <!-- 中间层六边形 -->
    <polygon points="60,22 92,42 92,78 60,98 28,78 28,42"
             stroke="url(#hex-stroke)" stroke-width="2.8" opacity=".55"/>
    <!-- 核心六边形 -->
    <polygon points="60,34 82,48 82,72 60,86 38,72 38,48"
             stroke="#20c7c2" stroke-width="3.2" opacity=".9" filter="url(#glow)"/>
  </g>

  <!-- 蜂巢内部电路连接线 -->
  <g fill="none" stroke-linecap="round" stroke-width="1.4" opacity=".5">
    <!-- 中心到各顶点的连接线 -->
    <line x1="60" y1="60" x2="60" y2="34" stroke="#20c7c2"/>
    <line x1="60" y1="60" x2="82" y2="48" stroke="#176fdf"/>
    <line x1="60" y1="60" x2="82" y2="72" stroke="#20c7c2"/>
    <line x1="60" y1="60" x2="60" y2="86" stroke="#176fdf"/>
    <line x1="60" y1="60" x2="38" y2="72" stroke="#20c7c2"/>
    <line x1="60" y1="60" x2="38" y2="48" stroke="#176fdf"/>
    <!-- 内部小电路分支 -->
    <line x1="60" y1="34" x2="72" y2="28" stroke="#20c7c2" opacity=".3"/>
    <line x1="82" y1="48" x2="90" y2="44" stroke="#176fdf" opacity=".3"/>
    <line x1="82" y1="72" x2="90" y2="76" stroke="#20c7c2" opacity=".3"/>
    <line x1="60" y1="86" x2="48" y2="92" stroke="#176fdf" opacity=".3"/>
    <line x1="38" y1="72" x2="30" y2="76" stroke="#20c7c2" opacity=".3"/>
    <line x1="38" y1="48" x2="30" y2="44" stroke="#176fdf" opacity=".3"/>
  </g>

  <!-- 触觉脉冲光点（6个节点，象征多触点反馈） -->
  <g filter="url(#glow-strong)">
    <!-- 顶点脉冲节点 -->
    <circle cx="60" cy="34" r="4" fill="url(#pulse-cyan)" class="pulse-node">
      <animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;1;.7" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="82" cy="48" r="4" fill="url(#pulse-blue)" class="pulse-node">
      <animate attributeName="r" values="3;5;3" dur="2.8s" begin=".7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;1;.7" dur="2.8s" begin=".7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="82" cy="72" r="4" fill="url(#pulse-orange)" class="pulse-node">
      <animate attributeName="r" values="3;5;3" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;1;.7" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="86" r="4" fill="url(#pulse-cyan)" class="pulse-node">
      <animate attributeName="r" values="3;5;3" dur="2.8s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;1;.7" dur="2.8s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="38" cy="72" r="4" fill="url(#pulse-blue)" class="pulse-node">
      <animate attributeName="r" values="3;5;3" dur="2.8s" begin=".35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;1;.7" dur="2.8s" begin=".35s" repeatCount="indefinite"/>
    </circle>
    <circle cx="38" cy="48" r="4" fill="url(#pulse-orange)" class="pulse-node">
      <animate attributeName="r" values="3;5;3" dur="2.8s" begin="1.05s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;1;.7" dur="2.8s" begin="1.05s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 中心核心光点（最强脉冲） -->
  <circle cx="60" cy="60" r="6" fill="url(#pulse-cyan)" filter="url(#glow-strong)">
    <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".6;1;.6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- 脉冲波纹扩散 -->
  <circle cx="60" cy="60" r="8" fill="none" stroke="#20c7c2" stroke-width=".8" opacity="0">
    <animate attributeName="r" values="8;22" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".5;0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="60" r="8" fill="none" stroke="#176fdf" stroke-width=".8" opacity="0">
    <animate attributeName="r" values="8;22" dur="2.5s" begin="1.25s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".5;0" dur="2.5s" begin="1.25s" repeatCount="indefinite"/>
  </circle>

  <!-- 角落装饰小电路点 -->
  <g fill="#20c7c2" opacity=".4">
    <circle cx="16" cy="34" r="1.8"/>
    <circle cx="104" cy="34" r="1.8"/>
    <circle cx="16" cy="86" r="1.8"/>
    <circle cx="104" cy="86" r="1.8"/>
  </g>
</svg>
