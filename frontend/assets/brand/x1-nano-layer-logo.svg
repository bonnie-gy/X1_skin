<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" role="img" aria-labelledby="x1-logo-title x1-logo-desc">
  <title id="x1-logo-title">X1 three-layer nano textile logo</title>
  <desc id="x1-logo-desc">A metallic blue upper wave, warm gold sensing dots, and a copper lower wave form a three-layer structure.</desc>
  <defs>
    <linearGradient id="metal-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1fbff"/>
      <stop offset="0.18" stop-color="#8ab4c8"/>
      <stop offset="0.48" stop-color="#244f6b"/>
      <stop offset="0.72" stop-color="#b9e1ed"/>
      <stop offset="1" stop-color="#163b56"/>
    </linearGradient>
    <linearGradient id="metal-copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1df"/>
      <stop offset="0.2" stop-color="#d9a86f"/>
      <stop offset="0.5" stop-color="#8a5a35"/>
      <stop offset="0.78" stop-color="#f0c38d"/>
      <stop offset="1" stop-color="#754724"/>
    </linearGradient>
    <radialGradient id="metal-dot" cx="32%" cy="22%" r="82%">
      <stop offset="0" stop-color="#fff8dc"/>
      <stop offset="0.28" stop-color="#f5d788"/>
      <stop offset="0.7" stop-color="#b37b31"/>
      <stop offset="1" stop-color="#67401e"/>
    </radialGradient>
    <filter id="metal-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#071116" flood-opacity=".34"/>
    </filter>
  </defs>
  <path d="M12 24 C23 14 35 14 46 24 S69 34 80 24 S101 14 108 21" fill="none" stroke="url(#metal-blue)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#metal-shadow)"/>
  <g fill="url(#metal-dot)" stroke="#fff0bd" stroke-opacity=".58" stroke-width=".7" filter="url(#metal-shadow)">
    <circle cx="12" cy="50" r="4.2"/>
    <circle cx="24" cy="43.5" r="4.2"/>
    <circle cx="36" cy="43.5" r="4.2"/>
    <circle cx="48" cy="50" r="4.2"/>
    <circle cx="60" cy="56.5" r="4.2"/>
    <circle cx="72" cy="56.5" r="4.2"/>
    <circle cx="84" cy="50" r="4.2"/>
    <circle cx="96" cy="43.5" r="4.2"/>
    <circle cx="108" cy="43.5" r="4.2"/>
  </g>
  <path d="M12 72 C23 62 35 62 46 72 S69 82 80 72 S101 62 108 69" fill="none" stroke="url(#metal-copper)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#metal-shadow)"/>
</svg>
